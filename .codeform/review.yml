# Sandbox review policy for review-e2e loop 2. Same shape as a real team's
# integration-branch policy: three ratings, Medium floors, High paths, issue
# ratings read from a Linear description line, six judges with rubrics, and the
# gate on a non-default base. Paths are the sandbox's own.
#
# Codeform reads this file and the rubrics from a PR's base branch, never from
# the PR. A PR that edits .codeform/ is rated High.
version: 2

ratings:
  - name: Low
  - name: Medium
    when:
      lines_over: 400
      files_over: 15
      any_flag: true
      blocked_before: true
      shared_surface: true
      # A touched path no rule matches is at least Medium.
      unmatched: true
      # No linked issue, or one with no rating, is at least Medium.
      unrated_issue: true
  - name: High
    when:
      issue_rating: High
      paths:
        # Review policy itself.
        - ".codeform/**"
        # identity
        - "app/auth/**"
        - "app/policies/**"
        # commerce
        - "app/payments/**"
        - "app/models/payment*.ts"
        # data
        - "db/**"
        # controls-deployment
        - ".github/**"
        - ".claude/**"
        - "config/**"
        - "Dockerfile*"
        # dependency manifests
        - "package.json"
        - "bun.lock"
        # shared dependencies
        - "src/core/**"
        # Shared string helpers (row 33, merged while a PR is open).
        - "src/lib/strings.ts"
        # Word helpers (loop 3 row 33, merged while a PR is open).
        - "src/lib/words.ts"
        # Pad helper (loop 4 row 33, merged while a PR is open).
        - "src/lib/pad.ts"

only_raise: true
rate_together: issue

issues:
  provider: linear
  key: "AVI-\\d+"
  rating:
    from: description
    pattern: "^Expected impact:\\s*(Low|Medium|High),\\s*because:"

honesty:
  split_above_lines: 600

roles:
  stewards: [isakbosman]
  qe: [isakbosman]

routes:
  Low:
    reviewers: 1
    from: stewards
    depth: full
    until_gated: blind
    due: 4h
  Medium:
    reviewers: 1
    from: stewards
    depth: focused
    due: 4h
  High:
    reviewers: 2
    from: code_owners
    depth: full
    due: 1d

extra_approvals:
  changed_expected_value: qe
  weakened_check: block
  failed_tagged_test: block
  open_question: block

checks:
  triggers:
    on: [ready_for_review, push, label]
    drafts: false

  verdict:
    unknown_as: flagged
    disagreement_as: flagged

  rating_judgment: true

  rubrics:
    spec: .codeform/rubrics/spec.md
    architecture: .codeform/rubrics/architecture.md
    security: .codeform/rubrics/security.md
    tests-and-controls: .codeform/rubrics/tests-and-controls.md
    proof: .codeform/rubrics/proof.md
    standards: .codeform/rubrics/standards.md

  # Six judges on OpenAI and xAI. The real policy's Anthropic runs are on OpenAI here.
  judges:
    spec:
      kind: agent
      rubric: spec
      models: [openai/gpt-6.2-sol, xai/grok-4.7]
    architecture:
      kind: agent
      rubric: architecture
      models: [xai/grok-4.7]
    security:
      kind: agent
      rubric: security
      models: [openai/gpt-6.2-sol, xai/grok-4.7]
    tests-and-controls:
      kind: agent
      rubric: tests-and-controls
      models: [xai/grok-4.7]
    proof:
      kind: agent
      rubric: proof
      models: [xai/grok-4.7]
    standards:
      kind: agent
      rubric: standards
      models: [xai/grok-4.7]

gate:
  kind: github-check
  name: route-gate
  poster: "codeform-ai[bot]"
  app: 5635014
  workbench: "Dev Test"
  bases: [work]

runs:
  places: [workbench]
  workbench: "Dev Test"
