version: 1
impact:
  high: ["app/payments/**", ".codeform/**"]
  medium: ["src/**"]
routes:
  low: { approvals: 1, from: { roles: [write] }, look: flagged }
  medium: { approvals: 1, from: { roles: [write] }, look: flagged }
  high: { approvals: 1, from: { codeowners: true }, look: full }
judges:
  correctness: { kind: builtin, dimension: correctness, effort: high }
gate:
  kind: github-check
  name: route-gate
