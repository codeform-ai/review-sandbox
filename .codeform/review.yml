# Sandbox review policy for the review-e2e drive. Structurally the same as a
# real team's integration-branch policy: ratings copied from an older
# impact-rules.yml, six judges with rubrics, the gate pinned to a Workbench and
# a non-default base branch. Paths and names are generic.
#
# Codeform reads this file and the rubrics from a PR's base branch, never from
# the PR, so a PR can't change the rules it's judged by. A PR that edits
# .codeform/ is rated High.
version: 2

ratings:
  - name: Low
  - name: Medium
    when:
      lines_over: 400
      files_over: 15
      any_flag: true
      blocked_before: true
      shared_surface: true
      # A touched path no rule matches is at least Medium until a person classifies it.
      unmatched: true
  - name: High
    when:
      issue_rating: High
      paths:
        # Review policy itself.
        - ".codeform/**"
        # identity: authentication, authorization, roles and tenant visibility
        - "app/auth/**"
        - "app/controllers/auth/**"
        - "app/models/role*.ts"
        - "app/models/tenant*.ts"
        - "app/policies/**"
        # commerce: payments, purchases and credits
        - "app/controllers/billing/**"
        - "app/models/purchase*.ts"
        - "app/models/payment*.ts"
        - "modules/ecommerce/**"
        # data: schema, migrations and bulk jobs
        - "db/migrate/**"
        - "db/schema.ts"
        - "app/jobs/bulk/**"
        # controls-deployment: review controls, CI, infrastructure and config
        - ".github/**"
        - ".claude/**"
        - "config/**"
        - "deploy/**"
        - "Dockerfile"
        - "package.json"
        - "bun.lock"
        # public api surface
        - "app/controllers/api/**"
        - "public/api/**"
        - "openapi*.yml"

only_raise: true
rate_together: issue

roles:
  stewards: [isakbosman]
  qe: [isakbosman]

routes:
  Low:
    reviewers: 1
    from: stewards
    depth: full
    until_gated: blind
    due: 4h
  Medium:
    reviewers: 1
    from: stewards
    depth: focused
    due: 4h
  High:
    reviewers: 2
    from: code_owners
    depth: full
    due: 1d

extra_approvals:
  changed_expected_value: qe
  weakened_check: block
  failed_tagged_test: block
  open_question: block
  uncovered_behavior:
    ask: stewards

automatic_merge:
  classes:
    - name: report-bug-fixes
      paths:
        - "app/reports/**"
      label: Bug
  earn:
    track_record:
      in_a_row: 30
      bugs_included: 10
    judge_bar:
      min_catch_rate_lower_bound: 0.8
  sample:
    start: "1 in 5"
    after_clean: 100
    then: "1 in 10"
    never_zero: true
  revoke_on: [sev1, sev2, sampled_miss, judge_below_bar]

checks:
  triggers:
    on: [ready_for_review, push]
    drafts: false

  verdict:
    unknown_as: flagged
    disagreement_as: flagged

  rating_judgment: true

  no_result:
    reviewers: 1
    from: stewards
    depth: full
    due: 4h

  budget:
    false_alarm_rate: 0.1
    catch_lower_bound: 0.8
    min_bad_cases: 30
    min_clean_cases: 30

  rubrics:
    spec: .codeform/rubrics/spec.md
    architecture: .codeform/rubrics/architecture.md
    security: .codeform/rubrics/security.md
    tests-and-controls: .codeform/rubrics/tests-and-controls.md
    proof: .codeform/rubrics/proof.md
    standards: .codeform/rubrics/standards.md

  # The real policy names anthropic/, openai/ and xai/ models. This Workbench
  # has OpenAI and xAI, so the six judges are spread across those two.
  judges:
    spec:
      kind: agent
      rubric: spec
      models: [openai/gpt-6.2-sol, xai/grok-4.7]
    architecture:
      kind: agent
      rubric: architecture
      models: [xai/grok-4.7]
    security:
      kind: agent
      rubric: security
      models: [openai/gpt-6.2-sol, xai/grok-4.7]
    tests-and-controls:
      kind: agent
      rubric: tests-and-controls
      models: [openai/gpt-6.2-sol]
    proof:
      kind: agent
      rubric: proof
      models: [xai/grok-4.7]
    standards:
      kind: agent
      rubric: standards
      models: [openai/gpt-6.2-sol]

gate:
  kind: github-check
  name: route-gate
  poster: "codeform-ai[bot]"
  app: 5635014
  workbench: "Dev Test"
  bases: [work]

runs:
  places: [workbench]
  workbench: "Dev Test"
