# codeform-live: the Linear write live check's base policy (2.9.63). Safe to delete.
version: 2
ratings:
  - name: Low
  - name: High
    when: { any_flag: true, issue_rating: High }
issues:
  provider: linear
  key: "AVI-\\d+"
  rating:
    from: description
    pattern: "^Expected impact:\\s*(Low|Medium|High),\\s*because:"
  questions:
    to: linear
    teams: [AVI]
roles:
  stewards: [isakbosman, codeform-live-steward]
routes:
  Low: { reviewers: 1, from: stewards, depth: focused }
  High: { reviewers: 1, from: stewards, depth: full }
checks:
  judges:
    correctness:
      kind: agent
      rubric: .codeform/rubrics/correctness.md
      models: [alibaba/qwen-plus]
  rating_judgment: false
  budget: { usd_per_run: 5 }
  verdict: { unknown_as: blocked }
  no_result: { reviewers: 1, from: stewards, depth: full }
gate:
  kind: github-status
  name: route-gate
